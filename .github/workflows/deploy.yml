name: Deploy to Infomaniak

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Create deployment archive
      run: |
        tar --exclude='node_modules' --exclude='.git' --exclude='.DS_Store' --exclude='*.tar.gz' --exclude='.github' --exclude='.svelte-kit' -czf moteeva-deploy.tar.gz build package.json package-lock.json

    - name: Install sshpass
      run: sudo apt-get install -y sshpass

    - name: Add server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H 57-105796.ssh.hosting-ik.com >> ~/.ssh/known_hosts

    - name: Transfer files to server
      env:
        SSHPASS: ${{ secrets.SSHPASS }}
      run: |
        sshpass -e scp moteeva-deploy.tar.gz dS7BhMKpcsV_moteeva@57-105796.ssh.hosting-ik.com:~/

    - name: Deploy on server
      env:
        SSHPASS: ${{ secrets.SSHPASS }}
      run: |
        sshpass -e ssh -o StrictHostKeyChecking=no dS7BhMKpcsV_moteeva@57-105796.ssh.hosting-ik.com "cd /srv/customer/apps/moteeva && tar -xzf ~/moteeva-deploy.tar.gz && npm ci --production && rm ~/moteeva-deploy.tar.gz && echo '✅ Déploiement terminé'"

name: Deploy to Infomaniak

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Install sshpass
      run: sudo apt-get install -y sshpass

    - name: Add server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H 57-105796.ssh.hosting-ik.com >> ~/.ssh/known_hosts

    - name: Upload build to server
      env:
        SSHPASS: ${{ secrets.SSHPASS }}
      run: |
        sshpass -e scp -r build/ dS7BhMKpcsV_moteeva@57-105796.ssh.hosting-ik.com:~/apps/moteeva/
        sshpass -e scp package.json package-lock.json dS7BhMKpcsV_moteeva@57-105796.ssh.hosting-ik.com:~/apps/moteeva/
        echo "✅ Build uploadé — redémarre l'app dans le panel Infomaniak"
